const STORAGE='rosterforge_fresh_final_2';let rosters=[];try{rosters=JSON.parse(localStorage.getItem(STORAGE)||localStorage.getItem('rosterforge_fresh_final_1')||localStorage.getItem('rosterforge_fresh_5')||localStorage.getItem('rosterforge_fresh_4')||localStorage.getItem('rosterforge_fresh_3')||localStorage.getItem('rosterforge_fresh_2')||'[]')}catch(e){}let active=0,page='home',selectedUnit=null;const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function unitCost(r,u){let d=lookup(r,u.id);if(!d||!d.points||d.points[u.size]==null)return null;return d.points[u.size]}function totalCost(r){let costs=r.units.map(u=>unitCost(r,u));return costs.every(v=>v!==null)?costs.reduce((a,b)=>a+b,0):null}function validateUnit(u){if(u.id!=='term'&&u.id!=='strike')return '';normalizeUnit(u);let special=u.models.filter(m=>m.ranged!=='Storm bolter');if(u.id==='strike'){let count=special.length;return count>Math.floor(u.size/5)?'특수무장 수량 초과: 5 models당 1기까지 가능':''}let ordinary=special.filter(m=>m.role==='Terminator').length;let ancient=u.models.filter(m=>m.role==='Ancient');let ap=u.models.filter(m=>m.role==='Apothecary');let just=u.models.filter(m=>m.role==='Justicar');if(just.length!==1)return 'Justicar는 1기여야 합니다';if(ancient.length>1||ap.length>1)return 'Ancient / Apothecary는 각각 최대 1기';if(ap.some(m=>m.ranged!=='Storm bolter'))return 'Apothecary는 Narthecium 장착 모델로 특수무장을 함께 선택할 수 없습니다';if(ordinary>Math.floor(u.size/5))return '일반 Terminator 특수무장 수량 초과';return ''} function save(){try{localStorage.setItem(STORAGE,JSON.stringify(rosters))}catch(e){alert('저장에 실패했습니다. 백업 기능을 이용하세요.')}}function current(){return rosters[active]}function lookup(r,id){return (catalog[r.faction]||[]).find(x=>x.id===id)}function closeSheet(){$('overlay').classList.add('hidden')}function openSheet(html){$('sheetContent').innerHTML=html;$('overlay').classList.remove('hidden')}function makeRoster(){openSheet(`<div class="row"><h2>로스터 만들기</h2><button onclick="closeSheet()">취소</button></div><label>로스터 이름</label><input id="newName" placeholder="예: 첫 번째 로스터" value="테스트"><label>Faction</label><select id="newFaction"><option value="gk">그레이 나이트</option></select><label>Points 한도</label><select id="newLimit"><option>500</option><option>1000</option><option>1500</option><option selected>2000</option><option>3000</option></select><p class="sub">이번 버전은 화면과 편성 흐름을 확인하는 기초 버전입니다.</p><button class="primary" style="width:100%" onclick="createRoster()">만들기</button>`)}function createRoster(){const r={name:$('newName').value.trim()||'새 로스터',faction:$('newFaction').value,limit:+$('newLimit').value,units:[]};rosters.push(r);active=rosters.length-1;save();closeSheet();page='list';render()}function showAdd(){let r=current();if(!r)return;openSheet(`<div class="row"><h2>유닛 추가</h2><button onclick="closeSheet()">완료</button></div><input id="search" placeholder="유닛 이름 검색" oninput="filterUnits()"><div id="unitResults">${unitRows('')}</div>`)}function unitRows(q){let r=current();return catalog[r.faction].filter(x=>(x.ko+' '+x.en).toLowerCase().includes(q.toLowerCase())).map(x=>`<div class="item row"><div><b>${esc(x.ko)}</b><div class="muted">${esc(x.en)} · ${esc(x.category)} · ${x.points?x.points[x.sizes[0]]+' pts':'Points 검증 대기'}</div></div><button onclick="addUnit('${x.id}')">추가</button></div>`).join('')||'<p class="empty">검색 결과가 없습니다.</p>'}function filterUnits(){$('unitResults').innerHTML=unitRows($('search').value)}function addUnit(id){let r=current(),d=lookup(r,id);r.units.push({id,size:d.sizes[0],models:Array.from({length:d.sizes[0]},(_,i)=>({role:d.roles[i===0?0:Math.min(1,d.roles.length-1)],weapon:d.weapons[0]}))});save();closeSheet();render()}function removeUnit(i){if(!confirm('유닛을 삭제할까요?'))return;current().units.splice(i,1);save();render()}// Model loadouts are represented as separate ranged and melee slots.
const BASE_MELEE='Nemesis force weapon';
function weaponEnglish(w){return WNAME[w]||w}
function isMelee(w){return (weapons[weaponEnglish(w)]||{}).kind==='m'}
function fixedLoadout(id,role){
 if(role==='Apothecary')return {ranged:'Storm bolter',melee:BASE_MELEE,lockedR:true,lockedM:true,note:'Apothecary: Narthecium은 고정 Wargear이며 변경할 수 없습니다.'};
 if(role==='Ancient')return {ranged:'Storm bolter',melee:BASE_MELEE,lockedR:false,lockedM:true,note:'Ancient’s Banner는 고정 Wargear입니다.'};
 if(id==='crowe')return {ranged:'Purifying flame',melee:BASE_MELEE,lockedR:true,lockedM:true,note:'Epic Hero의 기본 무장은 이 테스트에서 변경할 수 없습니다.'};
 if(id==='librarian')return {ranged:'Storm bolter',melee:BASE_MELEE,lockedR:true,lockedM:true,note:'Vortex of Doom은 별도 고정 Psychic 공격으로 표시됩니다.'};
 return {ranged:null,melee:BASE_MELEE,lockedR:false,lockedM:true,note:'Nemesis force weapon은 이 유닛의 고정 Melee 무장입니다.'};
}
function normalizeModel(u,m){
 const f=fixedLoadout(u.id,m.role);
 if(m.ranged===undefined)m.ranged=m.weapon&&!isMelee(m.weapon)?weaponEnglish(m.weapon):'Storm bolter';
 if(m.melee===undefined)m.melee=m.weapon&&isMelee(m.weapon)?weaponEnglish(m.weapon):BASE_MELEE;
 if(f.ranged)m.ranged=f.ranged;
 if(f.melee)m.melee=f.melee;
 m.weapon=m.ranged; // older backups still have the legacy weapon field
 return m;
}
function normalizeUnit(u){(u.models||[]).forEach(m=>normalizeModel(u,m));return u}
function allowedRanged(u,d,m){
 const f=fixedLoadout(u.id,m.role);
 if(f.lockedR)return [f.ranged];
 let available=d.weapons.map(weaponEnglish).filter(w=>!isMelee(w));
 if(!available.length)available=['Storm bolter'];
 return [...new Set(available)];
}
function editUnit(i){selectedUnit=i;let r=current(),u=normalizeUnit(r.units[i]),d=lookup(r,u.id);openSheet(`<div class="row"><h2>${esc(d.ko)}</h2><button onclick="closeSheet()">완료</button></div><div class="muted">${esc(d.en)}</div><label>분대 규모</label><select onchange="resizeUnit(${i},this.value)">${d.sizes.map(s=>`<option ${s===u.size?'selected':''} value="${s}">${s} models</option>`).join('')}</select><div class="warning">고정 Wargear는 잠금 표시되며 직군 변경 시 필수 무장을 자동 적용합니다. 검증되지 않은 무장 제한은 공식 자료와 대조해야 합니다.</div><div id="modelWarning" class="warning">${esc(validateUnit(u)||'편성 기본 검사 완료')}</div><div id="models">${modelRows(i)}</div><button onclick="closeSheet();datasheet(${i})" style="width:100%;margin-top:8px">선택한 무기 Stats 보기</button><button class="danger" style="width:100%;margin-top:15px" onclick="closeSheet();removeUnit(${i})">유닛 삭제</button>`)}
function modelRows(i){let r=current(),u=normalizeUnit(r.units[i]),d=lookup(r,u.id);return u.models.map((m,j)=>{
 let f=fixedLoadout(u.id,m.role),options=allowedRanged(u,d,m);

/* v28: offline, read-only New Recruit text roster comparison. */
function nr28Norm(v){return String(v||'').toLowerCase().replace(/[^a-z0-9]/g,'');}
function nr28Parse(t){
 const out=[], ignored=[], lines=String(t||'').split(/\r?\n/);
 const known=(catalog.gk||[]).concat(catalog.dg||[]);
 const names=new Map(known.map(d=>[nr28Norm(d.en),d.en]));
 const aliases={'grandmasterinnemesisdreadknight':'Grand Master in Nemesis Dreadknight'};
 for(let i=0;i<lines.length;i++){
  const line=lines[i].trim();
  if(!line)continue;
  let m=line.match(/^(?:[-*•]\s*)?(?:(\d+)\s*[x×]\s*)?(.+?)\s*\(([\d,]+)\s*(?:pts?|points?)\)/i);
  if(!m)m=line.match(/^(?:[-*•]\s*)?(?:(\d+)\s*[x×]\s*)?(.+?)\s*[-–:]\s*([\d,]+)\s*(?:pts?|points?)\s*$/i);
  if(!m)continue;
  const name=m[2].replace(/^\d+\s*x\s*/i,'').replace(/\s+\[[^\]]+\]$/,'').trim();
  const key=nr28Norm(name);
  if(/^(unnamedlist|strikeforce|incursion|onslaught|combatpatrol|army|roster|total|battle|enhancement|detachment|faction)/i.test(key)){ignored.push({name,line:i+1,reason:'로스터 정보'});continue;}
  const canon=names.get(key)||aliases[key];
  if(!canon){ignored.push({name,line:i+1,reason:'등록 유닛명 아님'});continue;}
  out.push({name:canon,points:+m[3].replace(/,/g,''),line:i+1,quantity:+(m[1]||1)});
 }
 return {entries:out,ignored};
}
function nr28Compare(){
 const r=current(),box=document.getElementById('nr28result'),t=document.getElementById('nr28input')?.value||'';
 if(!box)return;
 if(!r){box.innerHTML='<p class="warning">먼저 로스터를 선택하세요.</p>';return;}
 const parsed=nr28Parse(t),entries=parsed.entries;
 if(!entries.length){box.innerHTML='<p class="warning">Points가 포함된 유닛 행을 인식하지 못했습니다. New Recruit에서 GW 또는 Tournament 형식으로 내보낸 전체 텍스트를 붙여넣어 주세요.</p>';return;}
 const ours=r.units.map((u,i)=>{const d=lookup(r,u.id);return {i,name:d?.en||u.id,points:unitCost(r,u),size:u.size,u};});
 const used=new Set(),results=[],unmatched=[];
 for(const e of entries){
  let opts=ours.filter(x=>!used.has(x.i)&&nr28Norm(x.name)===nr28Norm(e.name));
  if(!opts.length){unmatched.push(e);continue;}
  const best=opts.find(x=>x.points===e.points)||opts[0];
  used.add(best.i);results.push({e,best,status:best.points===null?'unknown':best.points===e.points?'match':'diff'});
 }
 const missing=ours.filter(x=>!used.has(x.i));
 const match=results.filter(x=>x.status==='match').length,diff=results.filter(x=>x.status==='diff').length;
 const row=x=>`<div style="padding:9px 0;border-bottom:1px solid #ddd"><b>${esc(x.e.name)}</b><div class="sub">New Recruit ${x.e.points}pts / Fresh ${x.best.points??'미확인'}pts · ${x.status==='match'?'✓ 일치':x.status==='diff'?'⚠ '+(x.best.points-x.e.points)+'pts 차이':'? 확인 필요'}</div></div>`;
 box.innerHTML=`<div class="card"><b>비교 결과 · ${match}개 일치 / ${diff}개 차이</b><p class="sub">New Recruit 유닛 ${entries.length}개 · Fresh ${ours.length}유닛 · 대응 유닛 없음 ${unmatched.length}개 · 비유닛 행 제외 ${parsed.ignored.length}개</p>${results.map(row).join('')}${unmatched.length?`<h3>Fresh 로스터에 없는 New Recruit 유닛</h3>${unmatched.map(x=>`<p class="sub">${esc(x.name)} (${x.points}pts, ${x.line}행)</p>`).join('')}`:''}${missing.length?`<h3>Fresh에서 대응 유닛을 찾지 못함</h3>${missing.map(x=>`<p class="sub">${esc(x.name)} (${x.points??'?'}pts)</p>`).join('')}`:''}<p class="sub">로스터 제목·게임 크기·비유닛 항목은 비교에서 제외합니다. 같은 이름의 유닛은 Points가 일치하는 항목부터 1:1 매칭합니다. 현재는 Unit Points 비교이며 Wargear·Leader·Ability의 자동 대조는 지원하지 않습니다. New Recruit 내보내기에서 Enhancement 비용이 별도 행으로 표시되면 수동 확인하세요.</p></div>`;
}
const _nr28PrevRulePage=rulePage;
rulePage=function(){
 const old=_nr28PrevRulePage();
 return `<div class="card"><h2>New Recruit 로스터 비교 (Beta)</h2><p class="sub">New Recruit → Export / Share → GW 또는 Tournament 텍스트를 복사해서 붙여넣으세요. 현재 선택한 Fresh 로스터와 Unit별 Points를 오프라인에서 비교합니다. 저장된 로스터는 변경하지 않습니다.</p><textarea id="nr28input" rows="7" placeholder="예: 1x Grand Master in Nemesis Dreadknight (240 pts)" style="width:100%;box-sizing:border-box"></textarea><button class="primary" onclick="nr28Compare()">Points 비교 실행</button><div id="nr28result"></div></div>`+old;
};
